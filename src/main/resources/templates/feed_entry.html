<li class="list-entry">
    <span class="list-entry-text">
        <span class="list-entry-date" title="{{ entry.dateFull }}">{{ entry.dateShort }}</span>
        <a href="{{ entry.link }}" target="_blank" rel="noopener"
            title="{{ entry.feedName }}: {{ entry.title }}">{{entry.title }}</a>
        <span class="list-entry-feed">{{ entry.feedName }}</span>
    </span>
</li>
